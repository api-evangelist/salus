aid: salus
name: Salus
description: >-
  Salus provides runtime validation and governance for AI agents. It sits between an
  agent and its tools as a policy-aware proxy that intercepts each action before it
  executes, then clarifies, rewrites, escalates for human review, or blocks it against
  organizational policies — managing commit-time risk on financial transfers, appointment
  changes, and data modifications before they alter customer data, finances, or records.
  Integration requires only an endpoint URL change (no agent rewrite), and Salus works
  across OpenAI, Anthropic, Gemini, LangChain, LangGraph, CrewAI, Retell, Vapi, and custom
  tools. Capabilities include evidence-based validation, PII detection, budget and loop
  protection, idempotency checks, human-in-the-loop escalation, self-repair of blocked
  actions, and integrated evals and observability. Salus is a Y Combinator (Winter 2026)
  company based in San Francisco.
